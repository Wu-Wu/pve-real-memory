name: Build and release

# PRs against main and manual dispatch run the full test suite and build
# every binary for both architectures (native runners, artifacts only,
# nothing published). Pushing a tag vX.Y.Z additionally cuts a GitHub
# release: the release job gathers the four artifacts, writes the notes
# and uploads the assets with the built-in GITHUB_TOKEN (no secrets).
# The release assets are what install.sh serves via releases/latest.
#
# Proxmox 9.2+ supports both amd64 and arm64, so every event builds both
# arches natively (arm64 on ubuntu-24.04-arm); a failure of one arch
# never cancels the other.

on:
  push:
    tags:
      - v*
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # perl ships with the runner; internal/patch tests gate the
      # vmstatus patcher with `perl -c`
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -count=1 ./...

  build:
    strategy:
      fail-fast: false   # a failure in one arch must not cancel the other
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    name: build (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git describe needs tags for the version stamp

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build both binaries (${{ matrix.arch }})
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --always --dirty)"
          echo "version stamp: $VERSION"
          for cmd in pve-real-memory proxmox-rmem-helper; do
            CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
              go build -trimpath \
                -ldflags "-s -w -X main.version=$VERSION" \
                -o "bin/$cmd-linux-${{ matrix.arch }}" "./cmd/$cmd"
          done
          file bin/*
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: bin/*
          if-no-files-found: error

  release:
    needs: [ci, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # changelog needs the history since the previous tag

      - uses: actions/download-artifact@v4
        with:
          name: binaries-amd64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: binaries-arm64
          path: dist

      - name: Publish GitHub release with the four binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          tag="$GITHUB_REF_NAME"
          commit=$(git rev-list -n1 "$tag")
          # previous tag, empty for the initial release
          prev=$(git describe --tags --abbrev=0 "$commit^" 2>/dev/null || true)
          date=$(git log -1 --format=%cs "$commit")   # tagged commit date, ISO
          # notes are built with printf + git log --pretty only: no heredoc,
          # so nothing in a commit subject can expand or inject; single
          # quotes keep the deploy one-liner literal
          {
            printf '## pve-real-memory %s (%s)\n\n' "$tag" "$date"
            printf 'Real guest memory reporting for Proxmox VE 9.2+\n\n'
            printf 'Please try out the release binaries and report any issues at\nhttps://github.com/Wu-Wu/pve-real-memory/issues.\n\n'
            printf '### Binaries\n\nstatic, no dependencies\n\n'
            printf -- '- `pve-real-memory-linux-amd64` / `pve-real-memory-linux-arm64`\n'
            printf -- '- `proxmox-rmem-helper-linux-amd64` / `proxmox-rmem-helper-linux-arm64`\n\n'
            printf '### Deploy\n\n```\n'
            printf 'bash -c "$(curl -fsSL https://raw.githubusercontent.com/Wu-Wu/pve-real-memory/main/install.sh)"\n'
            printf '```\n\n'
            if [ -n "$prev" ]; then
              printf '## Changes since `%s`\n\n' "$prev"
              git log --no-merges --pretty=format:'- %s (%h)' "$prev..$tag"
            else
              printf '## Initial release\n\n'
              git log --no-merges --pretty=format:'- %s (%h)' "$tag"
            fi
            printf '\n'
          } > notes.md
          cat notes.md
          # no git context needed further: gh gets an explicit -R
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" -R "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" \
              --title "$tag" --notes-file notes.md
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" \
            dist/pve-real-memory-linux-* dist/proxmox-rmem-helper-linux-* --clobber
          gh release view "$tag" -R "$GITHUB_REPOSITORY"
        shell: bash
